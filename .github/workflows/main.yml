name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: recruitai
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: recruitai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recruitai -d recruitai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Apply test database migrations
      run: npx prisma migrate deploy
      env:
        DATABASE_URL: postgresql://recruitai:ci-test-password@localhost:5432/recruitai_test

    # Type errors fail the build. (Script is "typecheck" — do not add "|| true".)
    - name: Run Type Check
      run: npm run typecheck

    # Test failures fail the build.
    - name: Run Tests
      run: npm run test
      env:
        DATABASE_URL: postgresql://recruitai:ci-test-password@localhost:5432/recruitai_test
        TEST_DATABASE_URL: postgresql://recruitai:ci-test-password@localhost:5432/recruitai_test
        TEST_INTEGRATION: '1'

    # Keep lint findings visible on every push and pull request.
    - name: Run ESLint
      run: npm run lint

    - name: Build Next.js
      run: npm run build
      env:
        # Build-time placeholders: the app must not connect to real services during `next build`.
        DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
        NEXTAUTH_URL: 'http://localhost:3000'
        NEXTAUTH_SECRET: 'ci-placeholder-secret-min-32-characters-long!!'

    - name: Install Chromium for browser acceptance tests
      run: npx playwright install --with-deps chromium

    - name: Start production server
      run: npm run start > /tmp/recruitai-next.log 2>&1 &
      env:
        DATABASE_URL: postgresql://recruitai:ci-test-password@localhost:5432/recruitai_test
        NEXTAUTH_URL: http://127.0.0.1:3000
        NEXTAUTH_SECRET: ci-placeholder-secret-min-32-characters-long!!

    - name: Run browser end-to-end tests
      run: npm run test:e2e
      env:
        DATABASE_URL: postgresql://recruitai:ci-test-password@localhost:5432/recruitai_test
        TEST_DATABASE_URL: postgresql://recruitai:ci-test-password@localhost:5432/recruitai_test
        TEST_INTEGRATION: '1'
        NEXTAUTH_URL: http://127.0.0.1:3000
        NEXTAUTH_SECRET: ci-placeholder-secret-min-32-characters-long!!
        BASE_URL: http://127.0.0.1:3000
